# Example workflow — drop this into .github/workflows/ in your repo.
name: TestSprite

on:
  push:
    branches: [main]
  pull_request:

jobs:
  e2e:
    runs-on: ubuntu-latest
    # Fork PRs run without repository secrets, so the API key would be empty and
    # the check permanently red. Skip forks (a maintainer's push still runs it).
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    steps:
      - name: Run TestSprite tests
        id: testsprite
        uses: TestSprite/testsprite-action@v1
        with:
          api-key: ${{ secrets.TESTSPRITE_API_KEY }}
          project: "your-project-id"
          # filter: "checkout"        # optional: only tests whose name contains this
          # allow-partial: false      # default: fail the job if tests are skipped
          # timeout: 600
